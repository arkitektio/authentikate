name: Run Coverage

on:
  pull_request:
    branches: [main] # or any branches you want to target
  push:
    branches: [main]

jobs:
  run_tests:
    name: Python (Pull Request Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev

      # `uv run`, not `uvx`: uvx resolves the latest ruff at run time, so a new
      # ruff release could turn this red without a commit. The dev-dependency
      # pin in pyproject.toml is the single version, shared with contributors.
      - name: Check Ruff
        run: uv run ruff check .

      - name: Check basedpyright
        run: uv run basedpyright
